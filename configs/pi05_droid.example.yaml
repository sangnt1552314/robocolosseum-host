policy:
  name: pi05_droid
  checkpoint: lerobot/pi05_droid
  # pi0.5 manages its own mixed precision internally (SigLIP stays float32),
  # so dtype here is informational only -- the adapter does not recast weights.
  dtype: bfloat16
  device: cuda
  # Adapter-specific options.
  #
  # LeRobot/openpi batch keys for the pi05_droid checkpoint. The Colosseum
  # exterior slot feeds `base`, the wrist feeds `left_wrist`. `right_wrist` is
  # optional (single-arm DROID has one wrist); leave it unset and the policy's
  # image preprocessor pads/masks the missing camera. These key names come from
  # the checkpoint's config.image_features -- VERIFY if you change checkpoints.
  image_keys:
    base: observation.images.base_0_rgb
    left_wrist: observation.images.left_wrist_0_rgb
    # right_wrist: observation.images.right_wrist_0_rgb
  state_key: observation.state
  task_key: task
  # pi0.5 pads actions to the model's max_action_dim (32). Keep only the real
  # DROID action dims (7 joints + 1 gripper). Set null to disable slicing.
  action_dim: 8

# Map the Colosseum observation fields to the exterior / wrist camera slots.
# VERIFY against a real observation using scripts/test_router_readonly.py.
camera_mapping:
  external: left_image
  wrist: right_image

runtime:
  # walltime in SLURM is only a safety cap. These timeouts decide how quickly
  # the worker exits (and releases the GPU) once things go quiet.
  startup_timeout_seconds: 600   # wait this long for the first session
  idle_timeout_seconds: 600      # exit if no observation arrives for this long
  action_spaces: [joint_position]
  control_hz: 15
  max_horizon: 16
