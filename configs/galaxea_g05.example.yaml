policy:
  name: galaxea_g05
  # Path to the g05-droid checkpoint FILE (model_state_dict.pt). Its dir must
  # also contain .hydra/config.yaml and dataset_stats.json (standard g05 layout).
  # Download: huggingface-cli download OpenGalaxea/G05 --local-dir <g05_repo>/checkpoints
  checkpoint: /home/n/ntasang/repos/GalaxeaVLA/checkpoints/g05-droid/checkpoints/model_state_dict.pt
  dtype: bfloat16          # informational; precision handled by the g05 config
  device: cuda             # G0.5 inference runs on CUDA
  # Adapter-specific options.
  #
  # Cloned https://github.com/OpenGalaxea/GalaxeaVLA checkout (src-layout `g05`
  # package; shared resources under <repo>/checkpoints). Install its uv .venv.
  g05_repo: /home/n/ntasang/repos/GalaxeaVLA
  # Embodiment selector (Hydra eval_embodiment). DROID = Droid_Franka.
  eval_embodiment: Droid_Franka
  # Extra Hydra overrides. The g05-droid checkpoint is the discrete/CoT variant:
  overrides:
    - model.model_arch.discrete_action=true
    - model.model_arch.continuous_action=false
  # frequency: 15         # control Hz sent to the model (defaults to runtime.control_hz)
  #
  # Colosseum -> G0.5 raw-observation mapping. Keys MUST match the processor's
  # shape_meta (image/state keys are logged at load). Values are Colosseum
  # sources: "external"/"wrist" resolve via camera_mapping, else a literal
  # observation.state attribute; state sources also accept "joints"/"gripper" or
  # a list to concatenate. VERIFY the exact keys against the load-time log.
  image_features: {}       # e.g. {exterior_image_1_left: external, wrist_image_left: wrist}
  state_features: {}       # e.g. {joint_position: joints, gripper_position: gripper}
  # action_keys: [right_arm, right_gripper]   # order to concat; null = all predicted parts

# Map the Colosseum observation fields to the exterior / wrist camera slots.
# VERIFY against a real observation using scripts/test_router_readonly.py.
camera_mapping:
  external: left_image
  wrist: right_image

runtime:
  # walltime in SLURM/PBS is only a safety cap. These timeouts decide how
  # quickly the worker exits (and releases the GPU) once things go quiet.
  startup_timeout_seconds: 600   # wait this long for the first session
  idle_timeout_seconds: 600      # exit if no observation arrives for this long
  action_spaces: [joint_position]
  control_hz: 15
  max_horizon: 16
