# SO101 / stack_white_bowls_100episodes — MolmoAct2 worker config.
# Minimal config: only the policy name + local checkpoint are required; the rest
# fall back to defaults in robocolosseum.config. VERIFY the so101-specific values
# against a real observation before trusting execution.
policy:
  name: molmoact2
  checkpoint: /scratch/e1583535/projects/robocolosseum-training/outputs/molmoact2-so101-stack-white_bowls-100episodes/checkpoints/004690/pretrained_model
  dtype: bfloat16
  device: cuda

# SO101 has one external (third-person) + one wrist camera.
camera_mapping:
  external: left_image
  wrist: right_image

runtime:
  action_spaces: [joint_position]
  control_hz: 15
  max_horizon: 30   # VERIFY: molmoact2 so101 training used n_action_steps=30
